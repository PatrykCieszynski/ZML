name: Release v0.3.2

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v0.3.2.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        env:
          TARGET_SHA: f8a575b6a38e96ec6a07ca28f5ddaa233e5c0b99
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/v0.3.2" >/dev/null 2>&1; then
            echo "v0.3.2 already exists"
          else
            git tag v0.3.2 "$TARGET_SHA"
            git push origin v0.3.2
          fi

      - name: Dispatch Windows release packaging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run package-windows.yml --ref v0.3.2 -f build_name=v0.3.2
