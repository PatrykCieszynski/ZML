name: Release v0.3.3

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v0.3.3.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        env:
          TARGET_SHA: a567fe035b1fc7775bbb566a763a4bce01785034
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/v0.3.3" >/dev/null 2>&1; then
            echo "v0.3.3 already exists"
          else
            git tag v0.3.3 "$TARGET_SHA"
            git push origin v0.3.3
          fi

      - name: Dispatch Windows release packaging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run package-windows.yml --ref v0.3.3 -f build_name=v0.3.3
