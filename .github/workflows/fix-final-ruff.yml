name: Fix final rename imports

on:
  push:
    branches:
      - agent/final-repository-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-repository-cleanup
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Fix import ordering
        working-directory: apps/backend
        run: |
          uv sync --locked --package zml-backend
          uv run --package zml-backend ruff check \
            src/zml_backend/runtime/bootstrap.py \
            src/zml_backend/runtime/ocr_worker/supervisor.py \
            tests/runtime/ocr_worker/test_supervisor.py \
            --fix
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/backend/src/zml_backend/runtime/bootstrap.py \
            apps/backend/src/zml_backend/runtime/ocr_worker/supervisor.py \
            apps/backend/tests/runtime/ocr_worker/test_supervisor.py
          git commit -m "Fix import ordering after application renames"
          git push
