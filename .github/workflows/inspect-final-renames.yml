name: Finish final repository cleanup

on:
  push:
    branches:
      - agent/final-repository-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-repository-cleanup

      - name: Normalize remaining worker identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements_by_file = {
              Path('scripts/verify-python-artifacts.ps1'): [
                  ('AgentArtifactDir', 'WorkerArtifactDir'),
                  ('agentDir', 'workerDir'),
                  ('agentExe', 'workerExe'),
                  ('forbiddenBridgeEntries', 'forbiddenBackendEntries'),
                  ('Test-AgentProtocol', 'Test-WorkerProtocol'),
                  ('agentPid', 'workerPid'),
                  ('agentDeadline', 'workerDeadline'),
              ],
              Path('apps/desktop/electron/backend/backendProcessManager.ts'): [
                  ('ocrAgentExecutable', 'ocrWorkerExecutable'),
              ],
          }

          for path, replacements in replacements_by_file.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Guard remaining implementation vocabulary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github -E 'ocrAgentExecutable|AgentArtifactDir|agentDir|agentExe|Test-AgentProtocol|forbiddenBridgeEntries|agentPid|agentDeadline' scripts apps; then
            echo 'Stale local implementation identifier remains.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-python-artifacts.ps1 apps/desktop/electron/backend/backendProcessManager.ts
          git commit -m "Finish backend and OCR worker naming cleanup"
          git push
