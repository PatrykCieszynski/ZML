name: Package Windows

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Artifact name suffix
        required: false
        default: snapshot
  push:
    tags:
      - snapshot-*
      - v*

permissions:
  contents: write

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content apps/electron-ui/package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match desktop version $expectedTag"
          }

      - name: Set up bridge
        uses: ./.github/actions/setup-bridge

      - name: Verify bridge
        working-directory: apps/game-bridge
        run: just verify

      - name: Install OCR Agent dependencies
        working-directory: apps/ocr-agent
        run: uv sync --locked --dev

      - name: Verify OCR Agent
        working-directory: apps/ocr-agent
        run: just verify

      - name: Package OCR Agent
        working-directory: apps/ocr-agent
        run: just package

      - name: Package bridge
        working-directory: apps/game-bridge
        run: just package

      - name: Verify packaged process tree
        shell: pwsh
        run: ./scripts/verify-python-artifacts.ps1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Python components in Electron resources
        run: pnpm python:stage

      - name: Package Electron application
        run: pnpm frontend:package

      - name: Verify bundled Python process tree
        shell: pwsh
        run: |
          $backend = Get-ChildItem apps/electron-ui/release -Recurse -Filter zml-game-bridge.exe |
            Where-Object { $_.FullName -match 'win-unpacked[\\/]+resources[\\/]+backend' } |
            Select-Object -First 1
          $agent = Get-ChildItem apps/electron-ui/release -Recurse -Filter zml-ocr-agent.exe |
            Where-Object { $_.FullName -match 'win-unpacked[\\/]+resources[\\/]+ocr-agent' } |
            Select-Object -First 1
          if ($null -eq $backend) {
            throw "Bundled backend executable was not found in win-unpacked resources"
          }
          if ($null -eq $agent) {
            throw "Bundled OCR Agent executable was not found in win-unpacked resources"
          }
          & ./scripts/verify-python-artifacts.ps1 `
            -BridgeArtifactDir $backend.Directory.FullName `
            -AgentArtifactDir $agent.Directory.FullName

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/electron-ui/release -Recurse -Filter 'Z-Mining-Log-Windows-*-Setup.exe' |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "Windows installer was not produced"
          }
          Write-Host "Installer: $($installer.FullName)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: z-mining-log-windows-${{ github.event.inputs.build_name || github.ref_name }}
          path: apps/electron-ui/release/**/Z-Mining-Log-Windows-*-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apps/electron-ui/release/**/Z-Mining-Log-Windows-*-Setup.exe
