name: Fix desktop mock filename

on:
  push:
    branches:
      - agent/final-repository-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-repository-cleanup
      - name: Rename backend mock file
        shell: bash
        run: |
          set -euo pipefail
          git mv apps/desktop/electron/mocks/mockAgentRestClient.ts apps/desktop/electron/mocks/mockBackendRestClient.ts
          if grep -RIn --exclude-dir=node_modules -E 'mockAgentRestClient' apps/desktop; then
            echo 'Stale mock filename reference remains.' >&2
            exit 1
          fi
      - name: Commit rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/desktop/electron/mocks
          git commit -m "Rename desktop backend mock file"
          git push
