name: Fix OCR worker integration fixture

on:
  push:
    branches:
      - agent/final-repository-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-repository-cleanup
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Rename fixture and test identifier
        shell: pwsh
        run: |
          git mv apps/backend/tests/fixtures/fake_ocr_agent.py apps/backend/tests/fixtures/fake_ocr_worker.py
          $path = 'apps/backend/tests/runtime/ocr_worker/test_process_integration.py'
          $text = Get-Content $path -Raw
          $text = $text.Replace('_FAKE_AGENT', '_FAKE_WORKER')
          Set-Content $path $text -NoNewline
      - name: Run focused integration tests
        shell: pwsh
        run: |
          uv sync --locked --package zml-backend
          uv run --package zml-backend pytest apps/backend/tests/runtime/ocr_worker/test_process_integration.py --basetemp apps/backend/.pytest-tmp-fixture -o cache_dir=apps/backend/.pytest-cache-fixture
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/backend/tests/fixtures apps/backend/tests/runtime/ocr_worker/test_process_integration.py
          git commit -m "Rename OCR worker integration fixture"
          git push
