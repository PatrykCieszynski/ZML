name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr-protocol:
    name: OCR Protocol / Python
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync protocol dependencies
        run: uv sync --locked --package zml-ocr-protocol

      - name: Verify protocol
        run: just protocol verify

  ocr-agent:
    name: OCR Agent / Python
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync OCR Agent dependencies
        run: uv sync --locked --package zml-ocr-agent

      - name: Verify OCR Agent
        run: just ocr verify

  bridge:
    name: Bridge / Python
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync bridge dependencies
        run: uv sync --locked --package zml-game-bridge

      - name: Verify bridge
        run: just backend verify

  python-packaging:
    name: Python executables / Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync Python workspace
        run: uv sync --locked --all-packages

      - name: Package OCR Agent
        run: just ocr package

      - name: Package bridge
        run: just backend package

      - name: Verify packaged process tree
        shell: pwsh
        run: ./scripts/verify-python-artifacts.ps1

  frontend:
    name: Shared + Electron UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync bridge dependencies
        run: uv sync --locked --package zml-game-bridge

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API contract
        run: just api generate

      - name: Verify shared package
        run: just shared verify

      - name: Verify desktop
        run: just desktop verify
