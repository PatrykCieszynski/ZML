name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr-agent:
    name: OCR Agent / Python
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        working-directory: apps/ocr-agent
        run: uv python install

      - name: Install OCR Agent dependencies
        working-directory: apps/ocr-agent
        run: uv sync --locked --dev

      - name: Verify OCR Agent
        working-directory: apps/ocr-agent
        run: just verify

  bridge:
    name: Bridge / Python
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up bridge
        uses: ./.github/actions/setup-bridge

      - name: Verify bridge
        working-directory: apps/game-bridge
        run: just verify

  python-packaging:
    name: Python executables / Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up bridge
        uses: ./.github/actions/setup-bridge

      - name: Install OCR Agent dependencies
        working-directory: apps/ocr-agent
        run: uv sync --locked --dev

      - name: Package OCR Agent
        working-directory: apps/ocr-agent
        run: just package

      - name: Package bridge
        working-directory: apps/game-bridge
        run: just package

      - name: Verify packaged process tree
        shell: pwsh
        run: ./scripts/verify-python-artifacts.ps1

  frontend:
    name: Shared + Electron UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: pnpm frontend:verify
