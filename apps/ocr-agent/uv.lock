    { name = "mss", specifier = ">=10.1.0" },
    { name = "numpy", specifier = ">=2.4.0" },
    { name = "opencv-python-headless", specifier = ">=4.13.0.92" },
    { name = "pywin32", marker = "sys_platform == 'win32'", specifier = "==311" },
    { name = "tesserocr", marker = "platform_machine == 'AMD64' and sys_platform == 'win32'", url = "https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp313-cp313-win_amd64.whl" },
    { name = "zml-ocr-protocol", editable = "../../packages/ocr-protocol" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pyright", specifier = ">=1.1.408" },
    { name = "pytest", specifier = ">=9.0.2" },
    { name = "pytest-timeout", specifier = ">=2.4.0" },
    { name = "ruff", specifier = ">=0.14.11" },
    { name = "types-pywin32", specifier = ">=311.0.0.20260521" },
]

[[package]]
name = "zml-ocr-protocol"
version = "0.1.0"
source = { editable = "../../packages/ocr-protocol" }
dependencies = [
    { name = "pydantic" },
]

[package.metadata]
requires-dist = [{ name = "pydantic", specifier = ">=2.12.5,<3" }]

[package.metadata.requires-dev]
dev = [
    { name = "pyright", specifier = ">=1.1.408" },
    { name = "pytest", specifier = ">=9.0.2" },
    { name = "ruff", specifier = ">=0.14.11" },
]
